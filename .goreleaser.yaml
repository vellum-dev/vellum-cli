version: 2

builds:
  - id: vellum
    main: ./cmd/vellum
    binary: vellum
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w

archives:
  - format: binary
    name_template: "vellum-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

release:
  extra_files:
    - glob: bootstrap.sh

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true
