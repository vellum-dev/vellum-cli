version: 2

builds:
  - id: arm64
    main: ./cmd/vellum
    binary: vellum-linux-arm64
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
  - id: armv7
    main: ./cmd/vellum
    binary: vellum-linux-armv7
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w

archives:
  - format: binary
    name_template: "{{ .Binary }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true
